<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 故事创作 — TinyLLM-Story</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="container">
        <a href="index.html" class="nav-brand">
            <span class="logo-icon">📖</span>
            TinyLLM-Story
        </a>
        <div class="nav-links">
            <a href="index.html">📚 故事库</a>
            <a href="story-generate.html" class="active">✨ AI 创作</a>
            <a href="assistant.html">🤖 AI 助手</a>
            <a href="profile.html">👤 我的</a>
        </div>
        <div class="nav-user" id="nav-user-content">
            <a href="login.html" class="btn-outline">登录</a>
        </div>
    </div>
</nav>

<!-- Generate Page -->
<main class="generate-page">
    <h1 class="page-title">✨ AI 故事创作</h1>
    <p class="page-subtitle">输入你的创意，让 AI 为你生成独一无二的儿童故事</p>

    <!-- Generate Form -->
    <div class="generate-form">
        <div class="form-row">
            <div class="form-group">
                <label><span class="label-icon">📝</span> 故事主题</label>
                <input type="text" id="theme" placeholder="比如：勇敢的小兔子、会飞的房子...">
            </div>
            <div class="form-group">
                <label><span class="label-icon">📂</span> 故事分类</label>
                <select id="category">
                    <option value="">自动判断</option>
                    <option value="动物故事">🐱 动物故事</option>
                    <option value="童话故事">🏰 童话故事</option>
                    <option value="成长故事">🌱 成长故事</option>
                    <option value="冒险故事">🗺️ 冒险故事</option>
                    <option value="温馨故事">🌙 温馨故事</option>
                    <option value="友谊故事">🤝 友谊故事</option>
                    <option value="想象故事">✨ 想象故事</option>
                </select>
            </div>
        </div>

        <!-- 快捷预设创意标签 -->
        <div class="quick-tags" id="quickTags">
            <span class="quick-tags-label">💡 创意灵感：</span>
            <button class="quick-tag-chip" data-theme="勇敢小熊" data-category="动物故事">🐻 勇敢小熊</button>
            <button class="quick-tag-chip" data-theme="太空探险" data-category="冒险故事">🚀 太空探险</button>
            <button class="quick-tag-chip" data-theme="分享魔法棒" data-category="童话故事">🪄 分享魔法棒</button>
            <button class="quick-tag-chip" data-theme="海底奇遇" data-category="想象故事">🐠 海底奇遇</button>
            <button class="quick-tag-chip" data-theme="学会勇敢" data-category="成长故事">💪 学会勇敢</button>
            <button class="quick-tag-chip" data-theme="森林音乐会" data-category="友谊故事">🎵 森林音乐会</button>
            <button class="quick-tag-chip" data-theme="睡前月亮船" data-category="温馨故事">🌙 睡前月亮船</button>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label><span class="label-icon">🦸</span> 主角名称（可选）</label>
                <input type="text" id="character" placeholder="比如：小明、小兔子朵朵...">
            </div>
            <div class="form-group">
                <label><span class="label-icon">📏</span> 故事长度</label>
                <div class="length-slider">
                    <span style="font-size:13px;color:var(--text-secondary);">短</span>
                    <input type="range" id="lengthSlider" min="1" max="3" value="2" oninput="updateLengthLabel()">
                    <span style="font-size:13px;color:var(--text-secondary);">长</span>
                    <span class="slider-value" id="lengthLabel">中篇</span>
                </div>
                <select id="length" style="display:none;">
                    <option value="medium" selected>中篇 (~500字)</option>
                    <option value="short">短篇 (~200字)</option>
                    <option value="long">长篇 (~800字)</option>
                </select>
            </div>
        </div>

        <div class="form-row full">
            <div class="form-group">
                <label><span class="label-icon">💡</span> 额外要求（可选）</label>
                <textarea id="extra" placeholder="比如：包含一个谜题、主角最后学会了分享、故事发生在海底世界..."></textarea>
            </div>
        </div>

        <div class="form-row full">
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" id="genImages" checked style="width:auto;cursor:pointer;">
                    同时生成故事配图（AI 插图）
                </label>
            </div>
        </div>

        <div class="submit-row">
            <button class="btn btn-lg btn-primary" id="generateBtn" onclick="generateStory()">
                ✨ 开始创作
            </button>
            <button class="btn btn-lg btn-outline" id="cancelBtn" onclick="cancelGeneration()" style="display:none;">
                ⏹ 取消生成
            </button>
        </div>
    </div>

    <!-- Generation Progress (流式输出中) -->
    <div class="loading-spinner" id="generatingSpinner" style="display:none;">
        <div class="spinner"></div>
        <div class="spinner-text" id="generatingText">AI 正在构思故事...</div>
    </div>

    <!-- Generation Result -->
    <div class="generate-result" id="generateResult">
        <div class="result-header">
            <h3>📖 <span id="resultTitle">AI 生成的故事</span></h3>
            <div class="result-actions">
                <button class="btn btn-sm btn-outline" onclick="regenerateStory()">🔄 重新生成</button>
                <button class="btn btn-sm btn-primary" onclick="saveStory()">💾 保存故事</button>
            </div>
        </div>
        <div class="result-content" id="resultContent">
            <!-- 流式输出时：光标跟随在每个新 chunk 末尾闪烁 -->
            <span class="stream-cursor" id="streamCursor"></span>
        </div>
        <!-- 插图区域：异步加载，先展示骨架屏 -->
        <div class="generated-images" id="generatedImages" style="display:none;">
            <!-- 动态填充：骨架屏 → 真实图片淡入 -->
        </div>
    </div>

</main>

<footer class="footer">
    <div class="container">
        <div class="footer-brand">📖 TinyLLM-Story</div>
        <p>AI 驱动 · 儿童故事 · 智能创作 · 角色配音</p>
        <p style="margin-top:8px;">© 2026 TinyLLM-Story. All rights reserved.</p>
    </div>
</footer>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script>
// --- State ---
let isGenerating = false;
let generatedStory = null;
let cancelRequested = false;
let generationController = null;
let generationStream = null;  // EventSource 引用，用于取消

// --- Length Slider ---
function updateLengthLabel() {
    const val = document.getElementById('lengthSlider').value;
    const labels = { '1': '短篇 (~200字)', '2': '中篇 (~500字)', '3': '长篇 (~1000字)' };
    const selectValues = { '1': 'short', '2': 'medium', '3': 'long' };
    document.getElementById('lengthLabel').textContent = labels[val];
    document.getElementById('length').value = selectValues[val];
}

// ============================================================
// 快捷预设创意标签 — 点击自动填充主题与分类
// ============================================================
(function initQuickTags() {
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('quickTags').addEventListener('click', (e) => {
            const chip = e.target.closest('.quick-tag-chip');
            if (!chip || isGenerating) return;

            const theme = chip.dataset.theme;
            const category = chip.dataset.category;

            if (theme) {
                document.getElementById('theme').value = theme;
                document.getElementById('theme').focus();
                // 添加一个小动画反馈
                chip.classList.add('tag-popped');
                setTimeout(() => chip.classList.remove('tag-popped'), 300);
            }
            if (category) {
                const catSelect = document.getElementById('category');
                // 找到匹配的 option
                for (const opt of catSelect.options) {
                    if (opt.value === category) {
                        catSelect.value = category;
                        break;
                    }
                }
            }
        });
    });
})();

// ============================================================
// SSE 流式故事生成 — 真实逐字输出，取代旧的假打字机
// ============================================================
async function generateStory() {
    if (isGenerating) return;

    const theme = document.getElementById('theme').value.trim();
    if (!theme) {
        Toast.error('请输入故事主题');
        document.getElementById('theme').focus();
        document.getElementById('theme').classList.add('input-shake');
        setTimeout(() => document.getElementById('theme').classList.remove('input-shake'), 500);
        return;
    }

    // --- 进入生成状态 ---
    isGenerating = true;
    cancelRequested = false;
    generationController = new AbortController();

    // 隐藏创作按钮，显示取消按钮
    document.getElementById('generateBtn').style.display = 'none';
    document.getElementById('cancelBtn').style.display = 'inline-flex';

    // 准备结果容器（先清空，隐藏）
    const resultEl = document.getElementById('generateResult');
    resultEl.classList.remove('show');
    resultEl.classList.add('show'); // 立即显示框架
    document.getElementById('resultContent').innerHTML = '';
    document.getElementById('resultTitle').textContent = '✨ 正在创作中...';
    document.getElementById('generatedImages').style.display = 'none';
    document.getElementById('generatedImages').innerHTML = '';

    // 隐藏 spinner，直接在结果区展示流式内容
    document.getElementById('generatingSpinner').style.display = 'none';

    // 创建流式光标元素
    const contentEl = document.getElementById('resultContent');
    const cursorEl = document.createElement('span');
    cursorEl.className = 'stream-cursor';
    cursorEl.textContent = '▌';
    contentEl.appendChild(cursorEl);

    generatedStory = null;

    // 收集完整文本
    let fullText = '';
    let streamCategory = '';

    const streamData = {
        theme,
        category: document.getElementById('category').value,
        character: document.getElementById('character').value.trim(),
        length: document.getElementById('length').value,
        extra: document.getElementById('extra').value.trim(),
    };

    // streamFetch 返回 { close } 对象（基于 EventSource），不是 Promise
    // 状态通过回调管理
    let streamDone = false;

    function cleanupUI() {
        isGenerating = false;
        document.getElementById('generatingSpinner').style.display = 'none';
        document.getElementById('generateBtn').style.display = 'inline-flex';
        document.getElementById('cancelBtn').style.display = 'none';
        generationController = null;
    }

    try {
        const stream = API.generate.streamFetch(
            streamData,
            // --- onChunk: 每收到一个文本片段，追加到 DOM ---
            (text) => {
                if (cancelRequested) return;
                fullText += text;
                const textNode = document.createTextNode(text);
                contentEl.insertBefore(textNode, cursorEl);
                contentEl.scrollTop = contentEl.scrollHeight;
            },
            // --- onDone: 流结束，更新标题，异步加载插图 ---
            (result) => {
                if (streamDone) return;
                streamDone = true;
                fullText = result.full_text || fullText;
                streamCategory = result.category || streamData.category || '想象故事';

                const character = streamData.character || '小主角';
                document.getElementById('resultTitle').textContent =
                    `${streamData.theme}：${character}的故事`;

                if (cursorEl.parentNode) cursorEl.remove();

                generatedStory = {
                    title: `${streamData.theme}：${character}的故事`,
                    content: fullText,
                    category: streamCategory,
                };

                if (document.getElementById('genImages').checked && Auth.isLoggedIn()) {
                    loadImagesAsync(fullText, streamCategory);
                }

                cleanupUI();
                Toast.success('故事创作完成！✨');
            },
            // --- onError: 出错处理 ---
            (err) => {
                if (streamDone) return;
                streamDone = true;
                if (cursorEl.parentNode) cursorEl.remove();
                cleanupUI();
                if (!cancelRequested && (typeof err === 'string' ? err : err.name) !== 'AbortError') {
                    const msg = typeof err === 'string' ? err : (err.message || '请稍后重试');
                    Toast.error('故事生成失败: ' + msg);
                    if (fullText) {
                        document.getElementById('resultTitle').textContent = '⚠️ 部分生成的故事';
                    } else {
                        resultEl.classList.remove('show');
                    }
                }
            },
            // --- AbortSignal ---
            generationController.signal
        );

        // 保存 stream 引用用于取消
        generationStream = stream;
    } catch (err) {
        console.error('Generate Error:', err);
        if (!streamDone) {
            if (cursorEl.parentNode) cursorEl.remove();
            cleanupUI();
            if (!cancelRequested && err.name !== 'AbortError') {
                Toast.error('故事生成失败: ' + (err.message || '请稍后重试'));
            }
        }
    }
}

// ============================================================
// 插图异步加载 — 骨架屏 → 后台请求 → 淡入呈现
// ============================================================
async function loadImagesAsync(storyContent, category) {
    const imgContainer = document.getElementById('generatedImages');
    const imageCount = 3;

    // Step 1: 立即展示骨架屏占位
    imgContainer.style.display = 'grid';
    imgContainer.innerHTML = Array.from({ length: imageCount }, (_, i) =>
        `<div class="gen-image image-loading" data-image-index="${i}">
            <div class="image-skeleton"></div>
            <div class="image-skeleton-text">✨ AI 正在绘制第 ${i + 1} 张配图...</div>
        </div>`
    ).join('');

    // Step 2: 后台异步请求配图
    try {
        // 先尝试通过 POST /api/v1/generate/images 接口请求（需要 story_id）
        // 如果没有 story_id，则显示本地 SVG 兜底
        let imageUrls = [];

        if (generatedStory && generatedStory.id) {
            try {
                const result = await API.generate.images(generatedStory.id, imageCount);
                imageUrls = result.images || [];
            } catch (imgErr) {
                console.warn('远程配图请求失败，使用 SVG 兜底:', imgErr);
            }
        }

        // Step 3: 如果远程没有拿到图，生成本地 SVG 兜底图
        if (!imageUrls || imageUrls.length === 0) {
            imageUrls = generateFallbackSVGs(storyContent, category, imageCount);
        }

        // Step 4: 替换骨架屏为真实图片，淡入动画
        renderImagesWithFade(imgContainer, imageUrls);
    } catch (err) {
        console.error('图片加载异常:', err);
        // 出错时展示兜底图
        const fallbackUrls = generateFallbackSVGs(storyContent, category, imageCount);
        renderImagesWithFade(imgContainer, fallbackUrls);
    }
}

/** 生成本地 SVG 兜底插图 */
function generateFallbackSVGs(content, category, count) {
    const palettes = [
        ['#FFE4B5', '#FF9A9E', '#8EC5FC'],
        ['#D4FC79', '#96E6A1', '#84FAB0'],
        ['#C2FFD8', '#465EFB', '#B8C6DB'],
    ];
    const excerpt = (content || '').slice(0, 80);
    const encodedExcerpt = encodeURIComponent(excerpt);
    const encodedCategory = encodeURIComponent(category || '儿童故事');

    return Array.from({ length: count }, (_, i) => {
        const [sky, hill, accent] = palettes[i % palettes.length];
        const cx = 170 + i * 70;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
<defs><linearGradient id="sky${i}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${sky}"/><stop offset="1" stop-color="${accent}"/></linearGradient></defs>
<rect width="800" height="450" rx="28" fill="url(#sky${i})"/>
<circle cx="680" cy="90" r="48" fill="#FFF6B7" opacity=".9"/>
<path d="M0 330 Q140 220 280 330 T560 320 T800 300 V450 H0Z" fill="${hill}" opacity=".9"/>
<path d="M0 370 Q180 290 360 370 T800 350 V450 H0Z" fill="#FFFFFF" opacity=".36"/>
<g transform="translate(${cx},220)"><circle r="66" fill="#FFF8E7"/><circle cx="-23" cy="-8" r="8" fill="#394867"/><circle cx="23" cy="-8" r="8" fill="#394867"/><path d="M-24 22 Q0 42 24 22" fill="none" stroke="#E07A5F" stroke-width="7" stroke-linecap="round"/></g>
<text x="36" y="52" font-family="sans-serif" font-size="23" font-weight="700" fill="#394867">${encodedExcerpt}...</text>
<text x="38" y="84" font-family="sans-serif" font-size="15" fill="#394867" opacity=".8">${encodedCategory} · TinyLLM</text>
</svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
}

/** 将图片 URL 列表渲染到容器，带淡入动画 */
function renderImagesWithFade(container, urls) {
    if (!Array.isArray(urls) || urls.length === 0) {
        container.innerHTML = '';
        container.style.display = 'none';
        return;
    }

    container.innerHTML = urls.map((url, i) =>
        `<div class="gen-image image-fade-in" data-image-index="${i}" id="genImg${i}">
            <img src="${escapeHtml(url)}" alt="故事配图 ${i + 1}" loading="lazy"
                 onload="this.closest('.gen-image').classList.add('image-loaded')"
                 onerror="this.closest('.gen-image').classList.add('image-error')">
            <div class="select-overlay">
                <div class="select-check">✓</div>
            </div>
        </div>`
    ).join('');

    container.style.display = 'grid';
    container.querySelectorAll('.gen-image').forEach(el => {
        el.addEventListener('click', () => selectImage(Number(el.dataset.imageIndex)));
    });
}

// --- Cancel ---
function cancelGeneration() {
    cancelRequested = true;
    // 先中断 AbortController（如果有）
    if (generationController) generationController.abort();
    // 再关闭 EventSource 连接
    if (generationStream && typeof generationStream.close === 'function') {
        generationStream.close();
    }
    generationStream = null;
    Toast.info('已取消生成');
    resetGenerateUI();
}

function resetGenerateUI() {
    isGenerating = false;
    document.getElementById('generatingSpinner').style.display = 'none';
    document.getElementById('generateBtn').style.display = 'inline-flex';
    document.getElementById('cancelBtn').style.display = 'none';
}

// --- Regenerate ---
function regenerateStory() {
    document.getElementById('generateResult').classList.remove('show');
    document.getElementById('resultContent').innerHTML = '';
    document.getElementById('generatedImages').innerHTML = '';
    document.getElementById('generatedImages').style.display = 'none';
    generatedStory = null;
    generateStory();
}

// --- Save Story ---
function saveStory() {
    if (!Auth.isLoggedIn()) {
        Toast.error('请先登录后再保存故事');
        setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        return;
    }

    if (!generatedStory || !generatedStory.id) {
        // 流式模式下没有 story id，提示用户通过传统模式生成后保存
        Toast.info('流式创作的故事已展示，请登录后通过首页收藏功能保存');
        return;
    }
    API.stories.toggleFavorite(generatedStory.id)
        .then(() => Toast.success('故事已保存到你的收藏 ✨'))
        .catch(err => Toast.error('保存失败: ' + err.message));
}

// --- Select Image ---
function selectImage(index) {
    document.querySelectorAll('.gen-image').forEach(el => el.classList.remove('selected'));
    const target = document.getElementById('genImg' + index);
    if (target) target.classList.add('selected');
    Toast.success('已选择第 ' + (index + 1) + ' 张配图');
}

// --- Init ---
document.addEventListener('DOMContentLoaded', () => {
    updateLengthLabel();
    document.getElementById('theme').focus();
    if (!Auth.isLoggedIn()) {
        const imageLabel = document.querySelector('#genImages')?.parentElement;
        if (imageLabel) imageLabel.append('（登录后保存配图）');
    }
    // Support Enter key to generate from any text field
    document.querySelectorAll('.generate-form input[type="text"]').forEach(el => {
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isGenerating) generateStory();
        });
    });
});
</script>
</body>
</html>
